<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<title>Page Not Found — Md Sakib Sadman Badhon</title>
	<meta name="robots" content="noindex, follow">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="description" content="The page you're looking for doesn't exist. Return to Md Sakib Sadman Badhon's portfolio homepage.">

	<!-- Immediate theme detection to prevent flash -->
	<script>
		var storedTheme = localStorage.getItem('theme');
		if (storedTheme === 'dark' || (!storedTheme && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
			document.documentElement.classList.add('dark-mode');
		}
	</script>

	<link rel="stylesheet" type="text/css" href="css/stylesheet.min.css">

	<!-- Favicon -->
	<link rel="icon" type="image/svg+xml" href="/favicon.svg">
	<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
	<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
	<link rel="shortcut icon" href="/favicon.ico">
	<meta name="theme-color" content="#8dd3e3">

	<style>
		html,
		body {
			height: 100%;
			margin: 0;
			overflow: hidden;
		}

		body {
			display: flex;
		}

		.error-page {
			width: 100%;
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			text-align: center;
			padding: 20px;
			box-sizing: border-box;
		}

		.error-page .error-code {
			font-size: 7rem;
			font-weight: 700;
			line-height: 1;
			margin: 0;
			color: #8dd3e3;
		}

		.error-page h1 {
			font-size: 1.6rem;
			margin: 16px 0 8px;
		}

		.error-page p {
			font-size: 1rem;
			max-width: 460px;
			margin: 0 0 28px;
			opacity: 0.85;
		}

		.error-page .actions {
			display: flex;
			gap: 16px;
			flex-wrap: wrap;
			justify-content: center;
		}

		.error-page .action-link {
			display: inline-block;
			padding: 12px 28px;
			border-radius: 6px;
			text-decoration: none;
			font-weight: 600;
			transition: opacity 0.2s ease;
		}

		.error-page .action-link.primary {
			background: #8dd3e3;
			color: #14171f;
		}

		.error-page .action-link.secondary {
			background: transparent;
			color: #8dd3e3;
			border: 2px solid #8dd3e3;
		}

		.error-page .action-link:hover {
			opacity: 0.85;
		}
	</style>
</head>

<body>
	<main id="main-content" class="error-page">
		<p class="error-code" aria-hidden="true">404</p>
		<h1>Page Not Found</h1>
		<p>The page you're looking for doesn't exist or may have been moved.</p>
		<div class="actions">
			<a href="/" class="action-link primary">Portfolio</a>
			<a href="/social" class="action-link secondary">Social</a>
		</div>
	</main>
</body>

</html>

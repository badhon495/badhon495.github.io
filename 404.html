<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<title>Page Not Found — Md Sakib Sadman Badhon</title>
	<meta name="robots" content="noindex, follow">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="description" content="The page you're looking for doesn't exist. Return to Md Sakib Sadman Badhon's portfolio homepage.">

	<!-- Immediate theme detection to prevent flash -->
	<script>
		var storedTheme = localStorage.getItem('theme');
		if (storedTheme === 'dark' || (!storedTheme && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
			document.documentElement.classList.add('dark-mode');
		}
	</script>

	<script src="js/components.js"></script>
	<script src="js/mail.js" defer></script>
	<script src="js/last_modified.js" defer></script>
	<script src="js/hamburger.js" defer></script>
	<script src="js/navbar_scroll.js" defer></script>

	<link rel="stylesheet" type="text/css" href="css/stylesheet.min.css">
	<link rel="stylesheet" type="text/css" href="css/mail.css" media="print" onload="this.media='all'">
	<noscript>
		<link rel="stylesheet" type="text/css" href="css/mail.css">
	</noscript>

	<!-- Favicon -->
	<link rel="icon" type="image/svg+xml" href="/favicon.svg">
	<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
	<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
	<link rel="shortcut icon" href="/favicon.ico">
	<meta name="theme-color" content="#8dd3e3">

	<style>
		.error-page {
			min-height: calc(100vh - 48px);
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			text-align: center;
			padding: 40px 20px;
			box-sizing: border-box;
		}

		.error-page .error-code {
			font-size: 7rem;
			font-weight: 700;
			line-height: 1;
			margin: 0;
			color: #8dd3e3;
		}

		.error-page h1 {
			font-size: 1.6rem;
			margin: 16px 0 8px;
		}

		.error-page p {
			font-size: 1rem;
			max-width: 460px;
			margin: 0 0 28px;
			opacity: 0.85;
		}

		.error-page .home-link {
			display: inline-block;
			padding: 12px 28px;
			border-radius: 6px;
			background: #8dd3e3;
			color: #14171f;
			text-decoration: none;
			font-weight: 600;
			transition: opacity 0.2s ease;
		}

		.error-page .home-link:hover {
			opacity: 0.85;
		}

		.dark-mode .error-page .error-code {
			color: #8dd3e3;
		}
	</style>
</head>

<body>
	<a href="#main-content" class="skip-link">Skip to main content</a>
	<site-navbar></site-navbar>

	<main id="main-content" class="error-page">
		<p class="error-code" aria-hidden="true">404</p>
		<h1>Page Not Found</h1>
		<p>The page you're looking for doesn't exist or may have been moved.</p>
		<a href="/" class="home-link">Back to Homepage</a>
	</main>

	<site-footer></site-footer>
</body>

</html>
